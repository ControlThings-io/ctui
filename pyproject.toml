[project]
name = "ctui"
version = "1.0.0rc1"
description = "Build typed, asynchronous terminal UIs and command-line tools from one Python application"
authors = [{ name = "Justin Searle", email = "justin@controlthings.io" }]
requires-python = ">=3.11,<4"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
keywords = ["serial", "fieldbus", "ICS", "control", "ControlThings"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Intended Audience :: Manufacturing",
    "Intended Audience :: Other Audience",
    "Intended Audience :: Science/Research",
    "Environment :: Console",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Topic :: Utilities",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "aiosqlite>=0.22,<0.23",
    "platformdirs>=4,<5",
    "prompt-toolkit>=3.0.36,<4",
    "Pygments>=2.14.0,<3",
]

[project.urls]
Homepage = "https://www.controlthings.io"
Repository = "https://github.com/ControlThings-io/ctui"

[dependency-groups]
dev = ["pylint", "black", "isort"]

[tool.uv]
default-groups = "all"

[tool.black]
target-version = ["py311"]

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[tool.pylint.format]
max-line-length = "88"

[tool.isort]
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
line_length = 88
